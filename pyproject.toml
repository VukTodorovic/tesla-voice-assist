[project]
name = "tesla"
version = "0.1.0"
description = "Tesla - glasovni asistent za GNOME (Claude Code + whisper.cpp + Edge neural TTS)"
readme = "README.md"
authors = [
    { name = "Vuk Todorovic", email = "vt.todorovic@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "dbus-fast>=5.2.0",
    "edge-tts>=7.2.8",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "sounddevice>=0.5.6",
    "vosk>=0.3.45",
]

[project.scripts]
tesla = "tesla.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
